<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password — BioSync</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      "primary": "#041839", "primary-container": "#1c2d4f",
      "secondary": "#006398", "surface": "#f7f9fc",
      "surface-container-lowest": "#ffffff", "surface-container-low": "#f2f4f7",
      "on-surface": "#191c1e", "on-surface-variant": "#44474e",
      "outline-variant": "#c5c6cf", "error": "#ba1a1a",
    }, fontFamily: { "headline": ["Manrope"], "body": ["Inter"] }}}
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <a href="{{ url_for('main.index') }}">
      <img src="{{ url_for('static', filename='BioSync.png') }}" alt="BioSync" class="h-20 w-auto mx-auto mb-4"/>
    </a>
    <h1 class="text-2xl font-extrabold font-headline text-primary">Forgot your password?</h1>
    <p class="text-sm text-on-surface-variant mt-1">Enter your username and answer your security question.</p>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for message in messages %}
      <div class="bg-red-50 text-red-700 border border-red-200 rounded-xl px-4 py-3 text-sm font-medium mb-4">{{ message }}</div>
    {% endfor %}{% endif %}
  {% endwith %}

  <div class="bg-surface-container-lowest rounded-2xl shadow-sm p-8 space-y-5">
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5" id="forgot-form">

      <!-- Step 1: Username lookup -->
      <div id="step-username">
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
          <input type="text" name="username" id="username-input" required autofocus
            placeholder="Your BioSync username"
            class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-xl text-sm focus:ring-2 focus:ring-secondary/20 transition-all"/>
        </div>
        <button type="button" onclick="lookupUser()"
          class="w-full mt-4 py-3 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-full shadow-md hover:opacity-90 transition-all">
          Continue
        </button>
      </div>

      <!-- Step 2: Security question (revealed after username found) -->
      <div id="step-question" class="hidden space-y-4">
        <div class="bg-surface-container-low rounded-xl px-4 py-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-secondary text-sm">help_outline</span>
          <p class="text-sm font-semibold text-primary" id="question-text"></p>
        </div>
        <div>
          <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Your Answer</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock_open</span>
            <input type="text" name="security_answer" required
              placeholder="Not case-sensitive"
              class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-xl text-sm focus:ring-2 focus:ring-secondary/20 transition-all"/>
          </div>
        </div>
        <button type="submit"
          class="w-full py-3 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-full shadow-md hover:opacity-90 transition-all">
          Verify &amp; Continue
        </button>
      </div>

    </form>

    <div class="pt-2 text-center border-t border-outline-variant/20">
      <a href="{{ url_for('auth.login') }}" class="text-sm text-secondary hover:underline">Back to Login</a>
    </div>
  </div>
</div>

<script>
async function lookupUser() {
  const username = document.getElementById('username-input').value.trim();
  if (!username) { alert('Please enter your username.'); return; }

  const res = await fetch('/auth/lookup-question?username=' + encodeURIComponent(username));
  const data = await res.json();

  if (data.error) {
    alert(data.error);
    return;
  }

  document.getElementById('question-text').textContent = data.question;
  document.getElementById('step-username').classList.add('hidden');
  document.getElementById('step-question').classList.remove('hidden');
}
</script>
</body>
</html>
